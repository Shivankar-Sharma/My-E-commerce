{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
      <!-- Required meta tags -->
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
      <title>Clotheler Studio</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
      <!-- base:css -->
      <link rel="stylesheet" href="{% static 'vendors/mdi/css/materialdesignicons.min.css' %}">
      <link rel="stylesheet" href="{% static 'vendors/feather/feather.css' %}">
      <link rel="stylesheet" href="{% static 'vendors/base/vendor.bundle.base.css' %}">
      <!-- endinject -->
      <!-- plugin css for this page -->
      <link rel="stylesheet" href="{% static 'vendors/flag-icon-css/css/flag-icon.min.css' %}"/>
      <link rel="stylesheet" href="{% static 'vendors/font-awesome/css/font-awesome.min.css' %}">
      <link rel="stylesheet" href="{% static 'vendors/jquery-bar-rating/fontawesome-stars-o.css' %}">
      <link rel="stylesheet" href="{% static 'vendors/jquery-bar-rating/fontawesome-stars.css' %}">
      <!-- End plugin css for this page -->
      <!-- inject:css -->
      <link rel="stylesheet" href="{% static 'css/style.css' %}">
      <link rel="stylesheet" href="{% static 'css/clotheler-minimal.css' %}?v=18">
      <!-- endinject -->
      <link rel="shortcut icon" href="{% static 'images/favicon.png' %}" />
    </head>
    <body class="clotheler-theme">
        <div class="container-scroller">
            {% include 'navbar.html' %}
            <div class="container-fluid page-body-wrapper">
                {% include 'sidebar.html' %}
                {% block content %}
                {% endblock %}
                {% include 'footer.html' %}
            </div>
            <!-- page-body-wrapper ends -->
        </div>
        <!-- container-scroller -->

        <!-- Import Progress Modal -->
        <div class="modal fade" id="importProgressModal" tabindex="-1" role="dialog">
          <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">

              <div class="modal-header">
                <h5 class="modal-title">Importing Products</h5>

                <button type="button" class="close" id="modalCloseBtn" disabled>
                  <span>&times;</span>
                </button>
              </div>

              <div class="modal-body">
                <p id="progressText">Preparing import…</p>

                <div class="progress">
                  <div
                    id="progressBar"
                    class="progress-bar progress-bar-striped progress-bar-animated"
                    style="width:0%">
                    0%
                  </div>
                </div>
              </div>

              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="footerCloseBtn" disabled>
                  Close
                </button>
              </div>

            </div>
          </div>
        </div>

    </body>

     <!-- base:js -->
      <script src="{% static 'vendors/base/vendor.bundle.base.js' %}"></script>
      <!-- endinject -->
      <!-- Plugin js for this page-->
      <!-- End plugin js for this page-->
      <!-- inject:js -->
      <script src="{% static 'js/off-canvas.js' %}"></script>
      <script src="{% static 'js/hoverable-collapse.js' %}"></script>
      <script src="{% static 'js/template.js' %}"></script>
      <!-- endinject -->
      <!-- plugin js for this page -->
      <script src="{% static 'vendors/chart.js/Chart.min.js' %}"></script>
      <script src="{% static 'vendors/jquery-bar-rating/jquery.barrating.min.js' %}"></script>
      <!-- End plugin js for this page -->
      <!-- Custom js for this page-->
      <script src="{% static 'js/dashboard.js' %}"></script>
      <!-- End custom js for this page-->
      <script>
        const importStatusBaseUrl = "{% url 'import-status' 'JOB_ID_PLACEHOLDER' %}";
        function uploadFile() {
            let fileInput = document.createElement("input");
            fileInput.type = "file";
            fileInput.accept = ".xlsx,.xls";

            // Handle file selection
            fileInput.onchange = function() {
                let file = fileInput.files[0];
                if (!file) return;

                let formData = new FormData();
                formData.append("file", file);

                const uploadUrl = "{% url 'import-products' %}";

                $.ajax({
                    url: uploadUrl,   // Django endpoint
                    type: "POST",
                    data: formData,
                    processData: false,
                    contentType: false,
                    headers: {
                        "X-CSRFToken": getCookie("csrftoken")
                    },
                    success: function (response) {
                        openProgressModal();

                        const jobId = response.job_id;
                        startPolling(jobId);

                        console.log("Server response:", response);
                    },
                    error: function (xhr, status, error) {
                        console.error("Error:", error);
                    }
                });
            }

            // trigger file dialog after binding onchange
            fileInput.click();
        }

        function uploadPoFile() {
            let fileInput = document.createElement("input");
            fileInput.type = "file";
            fileInput.accept = ".xlsx,.xls";

            // Handle file selection
            fileInput.onchange = function() {
                let file = fileInput.files[0];
                if (!file) return;

                let formData = new FormData();
                formData.append("file", file);

                const uploadUrl = "{% url 'import-po-templates' %}";

                $.ajax({
                    url: uploadUrl,   // Django endpoint
                    type: "POST",
                    data: formData,
                    processData: false,
                    contentType: false,
                    headers: {
                        "X-CSRFToken": getCookie("csrftoken")
                    },
                    success: function (response) {
                        openProgressModal();

                        const jobId = response.job_id;
                        startPolling(jobId);

                        console.log("Server response:", response);
                    },
                    error: function (xhr, status, error) {
                        console.error("Error:", error);
                    }
                });
            }

            // trigger file dialog after binding onchange
            fileInput.click();
        }

        // Helper function for CSRF token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== "") {
                let cookies = document.cookie.split(";");
                for (let i = 0; i < cookies.length; i++) {
                    let cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + "=")) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        function openProgressModal() {
            $("#importProgressModal").modal({
                backdrop: "static",
                keyboard: false,
                show: true
            });
        }

        function startPolling(jobId) {
            const uploadUrl = importStatusBaseUrl.replace(
                "JOB_ID_PLACEHOLDER",
                jobId
            );
            importInterval = setInterval(() => {
                fetch(uploadUrl)
                    .then(res => res.json())
                    .then(updateProgressUI)
                    .catch(err => {
                        console.error("Polling error", err);
                    });
            }, 2000); // every 2 seconds
        }

        function updateProgressUI(data) {
            const progressBar = document.getElementById("progressBar");
            const progressText = document.getElementById("progressText");

            if (data.total > 0) {
                const percent = Math.floor((data.processed / data.total) * 100);
                progressBar.style.width = percent + "%";
                progressBar.innerText = percent + "%";
                progressText.innerText =
                    `Processed ${data.processed} of ${data.total} products`;
            }

            if (data.status === "finished") {
                progressBar.classList.remove("progress-bar-animated");
                progressBar.classList.add("bg-success");
                progressText.innerText = "Import completed successfully ✅";
                enableCloseButtons();
                stopPolling();
            }

            if (data.status === "failed") {
                progressBar.classList.remove("progress-bar-animated");
                progressBar.classList.add("bg-danger");
                progressText.innerText = "Import failed ❌";
                enableCloseButtons();
                stopPolling();
            }
        }

        function enableCloseButtons() {
            $("#modalCloseBtn").prop("disabled", false);
            $("#footerCloseBtn").prop("disabled", false);
        }


        function stopPolling() {
            clearInterval(importInterval);
        }

        function closeProgressModal() {
            $("#importProgressModal").modal("hide");
        }

        function initSidebarResize() {
            const handle = document.getElementById("sidebarResizeHandle");
            if (!handle) return;
            if (window.matchMedia("(max-width: 991.98px)").matches) return;

            const root = document.documentElement;
            const body = document.body;
            const minWidth = 240;
            const maxWidth = 420;
            const widthKey = "clothelerSidebarWidth";
            const expandedWidthKey = "clothelerSidebarExpandedWidth";
            const minimizeBtn = document.querySelector('[data-toggle="minimize"]');

            function applySidebarWidth(value) {
                const width = Math.max(minWidth, Math.min(maxWidth, value));
                root.style.setProperty("--cl-sidebar-width", width + "px");
                localStorage.setItem(widthKey, String(width));
            }

            const savedWidth = parseInt(localStorage.getItem(widthKey), 10);
            if (!Number.isNaN(savedWidth) && !body.classList.contains("sidebar-icon-only")) {
                applySidebarWidth(savedWidth);
            }

            function onMouseMove(event) {
                applySidebarWidth(event.clientX);
            }

            function onMouseUp() {
                document.removeEventListener("mousemove", onMouseMove);
                document.removeEventListener("mouseup", onMouseUp);
                document.body.style.userSelect = "";
            }

            handle.addEventListener("mousedown", function (event) {
                if (body.classList.contains("sidebar-icon-only")) return;
                event.preventDefault();
                document.body.style.userSelect = "none";
                document.addEventListener("mousemove", onMouseMove);
                document.addEventListener("mouseup", onMouseUp);
            });

            handle.addEventListener("dblclick", function () {
                applySidebarWidth(240);
            });

            if (minimizeBtn) {
                minimizeBtn.addEventListener("click", function () {
                    setTimeout(function () {
                        if (body.classList.contains("sidebar-icon-only")) {
                            const currentWidth = parseInt(getComputedStyle(root).getPropertyValue("--cl-sidebar-width"), 10);
                            if (!Number.isNaN(currentWidth) && currentWidth > 70) {
                                localStorage.setItem(expandedWidthKey, String(currentWidth));
                            }
                        } else {
                            const expandedWidth = parseInt(localStorage.getItem(expandedWidthKey) || localStorage.getItem(widthKey), 10);
                            if (!Number.isNaN(expandedWidth)) {
                                applySidebarWidth(expandedWidth);
                            }
                        }
                    }, 0);
                });
            }
        }

        function initSidebarAutoExpandOnMenuClick() {
            const body = document.body;
            const minimizeBtn = document.querySelector('[data-toggle="minimize"]');
            const collapsibleLinks = document.querySelectorAll('#sidebar .nav-link[data-toggle="collapse"]');
            if (!minimizeBtn || !collapsibleLinks.length) return;

            collapsibleLinks.forEach(function (link) {
                link.addEventListener("click", function (event) {
                    if (window.matchMedia("(max-width: 991.98px)").matches) return;
                    if (!body.classList.contains("sidebar-icon-only")) return;

                    event.preventDefault();
                    const targetSelector = link.getAttribute("href");
                    minimizeBtn.click();

                    setTimeout(function () {
                        if (!targetSelector) return;
                        const target = document.querySelector(targetSelector);
                        if (!target) return;

                        if (window.jQuery && typeof window.jQuery(target).collapse === "function") {
                            window.jQuery(target).collapse("show");
                        } else {
                            target.classList.add("show");
                        }
                    }, 220);
                });
            });
        }

        document.addEventListener("DOMContentLoaded", function () {
            $("#modalCloseBtn").on("click", function () {
                closeProgressModal();
            });

            $("#footerCloseBtn").on("click", function () {
                closeProgressModal();
            });

            initSidebarResize();
            initSidebarAutoExpandOnMenuClick();
        });

      </script>
</html>
