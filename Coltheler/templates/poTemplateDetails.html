{% extends 'base.html' %}

{% block content %}
<div class="main-panel">
  <div class="content-wrapper">
    <div class="row">
      <div class="col-12 grid-margin">
        <div class="card">
          <div class="card-body">
            <div class="clotheler-table-head mb-3">
              <div>
                <p class="clotheler-overline mb-2">OPERATIONS</p>
                <h4 class="card-title mb-0">PO Template Details</h4>
              </div>
            </div>
            {% if poTemplate and poTemplate.reference and poTemplate.sku %}
              <form class="clotheler-compact-form" action="{% url 'po-template-details-create' poTemplate.reference poTemplate.sku %}" method="POST">
            {% else %}
              <form class="clotheler-compact-form" action="{% url 'po-template-details' %}" method="POST">
            {% endif %}
              {% csrf_token %}
              <p class="clotheler-section-title">Basic Info</p>

              <div class="row">
                <div class="col-12 col-lg-6">
                  <div class="form-group">
                    <label>Reference</label>
                    <input type="text" name="reference" class="form-control" value="{{ poTemplate.reference|default_if_none:'' }}" {% if poTemplate and poTemplate.pk %}readonly{% endif %} />
                  </div>
                </div>
                <div class="col-12 col-lg-6">
                  <div class="form-group">
                    <label>SKU</label>
                    <input type="text" name="sku" class="form-control" value="{{ poTemplate.sku|default_if_none:'' }}" {% if poTemplate and poTemplate.pk %}readonly{% endif %} />
                  </div>
                </div>
              </div>

              <div class="row">
                <div class="col-12 col-lg-6">
                  <div class="form-group">
                    <label>Purchase Date</label>
                    <input type="date" name="purchase_date" class="form-control" value="{{ poTemplate.purchase_date|date:'Y-m-d' }}" />
                  </div>
                </div>
                <div class="col-12 col-lg-6">
                  <div class="form-group">
                    <label>Delivery Date</label>
                    <input type="date" name="delivery_date" class="form-control" value="{{ poTemplate.delivery_date|date:'Y-m-d' }}" />
                  </div>
                </div>
              </div>

              <div class="row">
                <div class="col-12 col-lg-6">
                  <div class="form-group">
                    <label>Requested Shipping</label>
                    <input type="date" name="requested_shipping_date" class="form-control" value="{{ poTemplate.requested_shipping_date|date:'Y-m-d' }}" />
                  </div>
                </div>
                <div class="col-12 col-lg-6">
                  <div class="form-group">
                    <label>Style Ranking</label>
                    <select name="style_ranking" class="form-control">
                      <option value="">Select Style Ranking</option>
                      {% if options and options.STYLE_RANKING %}
                        {% for option in options.STYLE_RANKING %}
                          <option value="{{ option.option_id }}"
                            {% if poTemplate.style_ranking and option.option_id == poTemplate.style_ranking.pk %}
                              selected
                            {% endif %}
                          >{{ option.option_value }}</option>
                        {% endfor %}
                      {% endif %}
                    </select>
                  </div>
                </div>
              </div>

              <div class="row">
                <div class="col-12 col-lg-6">
                  <div class="form-group">
                    <label>Variant Name</label>
                    <textarea rows="3" name="variant_name" class="form-control">{{ poTemplate.variant_name|default_if_none:'' }}</textarea>
                  </div>
                </div>
                <div class="col-12 col-lg-6">
                  <div class="form-group">
                    <label>Warehouse</label>
                    <input type="text" name="warehouse" class="form-control" value="{{ poTemplate.warehouse|default_if_none:'' }}" />
                  </div>
                </div>
              </div>

              <div class="row">
                <div class="col-12 col-lg-6">
                  <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" min="0" name="quantity" class="form-control" value="{{ poTemplate.quantity|default_if_none:0 }}" />
                  </div>
                </div>
                <div class="col-12 col-lg-6">
                  <div class="form-group">
                    <label>Unit Price</label>
                    <input type="number" step="0.01" min="0" name="unit_price" class="form-control" value="{{ poTemplate.unit_price|default_if_none:'' }}" />
                  </div>
                </div>
              </div>

              <div class="row">
                <div class="col-12 col-lg-4">
                  <div class="form-group">
                    <label>Reference has WHL</label>
                    <div class="d-flex align-items-center">
                      <input type="checkbox" name="reference_have_whl" {% if poTemplate.reference_have_whl %}checked{% endif %}>
                    </div>
                  </div>
                </div>
                <div class="col-12 col-lg-4">
                  <div class="form-group">
                    <label>Sample PO</label>
                    <div class="d-flex align-items-center">
                      <input type="checkbox" name="sample_po" {% if poTemplate.sample_po %}checked{% endif %}>
                    </div>
                  </div>
                </div>
                <div class="col-12 col-lg-4">
                  <div class="form-group">
                    <label>GS1 Indicator</label>
                    <div class="d-flex align-items-center">
                      <input type="checkbox" name="gs1_indicator" {% if poTemplate.gs1_indicator %}checked{% endif %}>
                    </div>
                  </div>
                </div>
              </div>

              <div class="row">
                <div class="col-12 clotheler-form-actions">
                  <button class="btn btn-primary" type="submit">Save</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
