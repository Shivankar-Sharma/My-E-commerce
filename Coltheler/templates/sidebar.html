{% load static %}

<!-- partial:partials/_sidebar.html -->
  <nav class="sidebar sidebar-offcanvas" id="sidebar">
    <div class="user-profile">
      <div class="user-image">
        {% if sidebar_profile_pic %}
          <img src="{{ sidebar_profile_pic.url }}" alt="profile">
        {% else %}
          <img src="{% static 'images/faces/face1.jpg' %}" alt="profile">
        {% endif %}
      </div>
      <div class="user-name">
          {{ user.username }}
      </div>
      <div class="user-designation">
          {{ user.email }}
      </div>
    </div>
    <ul class="nav">
      <li class="nav-item">
        <a class="nav-link" href="{% url 'home' %}">
          <i class="icon-box menu-icon"></i>
          <span class="menu-title">Overview</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="{% url 'asset-library' %}">
          <i class="icon-folder menu-icon"></i>
          <span class="menu-title">Assets</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" data-toggle="collapse" href="#products-nav" aria-expanded="false" aria-controls="products-nav">
          <i class="icon-disc menu-icon"></i>
          <span class="menu-title">Products</span>
          <i class="menu-arrow"></i>
        </a>
        <div class="collapse" id="products-nav">
          <ul class="nav flex-column sub-menu">
            <li class="nav-item"> <a class="nav-link" href="{% url 'products' %}">Products</a></li>
            <li class="nav-item"> <a class="nav-link" href="{% url 'po-templates' %}">PO Templates</a></li>
            <li class="nav-item"> <a class="nav-link" href="{% url 'options' %}">Options</a></li>
          </ul>
        </div>
      </li>
      <li class="nav-item">
        <a class="nav-link" data-toggle="collapse" href="#imports-nav" aria-expanded="false" aria-controls="imports-nav">
          <i class="icon-file menu-icon"></i>
          <span class="menu-title">Imports</span>
          <i class="menu-arrow"></i>
        </a>
        <div class="collapse" id="imports-nav">
          <ul class="nav flex-column sub-menu">
            <li class="nav-item"><a class="nav-link" onclick="uploadFile()" href="#">Upload Products</a></li>
            <li class="nav-item"><a class="nav-link" onclick="uploadPoFile()" href="#">Upload PO Templates</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'imports' %}">Import History</a></li>
          </ul>
        </div>
      </li>
    </ul>
    <div id="sidebarResizeHandle" class="sidebar-resize-handle" title="Drag to resize"></div>
  </nav>
