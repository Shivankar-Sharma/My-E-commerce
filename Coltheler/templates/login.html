{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Clotheler Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'vendors/mdi/css/materialdesignicons.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendors/feather/feather.css' %}">
  <link rel="stylesheet" href="{% static 'vendors/base/vendor.bundle.base.css' %}">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/clotheler-minimal.css' %}?v=18">
  <link rel="shortcut icon" href="{% static 'images/favicon.png' %}" />
</head>
<body class="clotheler-theme clotheler-auth">
  <main class="clotheler-auth-page">
    <section class="clotheler-auth-showcase">
      <p class="clotheler-overline">CLOTHELER STUDIO</p>
      <h1>Welcome back</h1>
      <p>Manage products, templates, and imports from a single clean workspace.</p>
    </section>

    <section class="clotheler-auth-card">
      <div class="mb-4">
        <a href="{% url 'login' %}" class="clotheler-auth-brand">CLOTHELER</a>
        <h4 class="mt-3 mb-1">Sign in</h4>
        <p class="text-muted mb-0">Use your account to continue.</p>
      </div>

      <form action="{% url 'login' %}" method="POST">
        {% csrf_token %}
        <div class="form-group">
          <label>Username</label>
          <input type="text" class="form-control" name="username" placeholder="Enter username" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" name="password" placeholder="Enter password" required>
        </div>
        <div class="my-3">
          <button class="btn btn-primary btn-block">Log In</button>
        </div>
        <p class="mb-0 text-muted">
          New to Clotheler? <a href="{% url 'register' %}" class="text-primary font-weight-semibold">Create account</a>
        </p>
      </form>
    </section>
  </main>

  <script src="{% static 'vendors/base/vendor.bundle.base.js' %}"></script>
  <script src="{% static 'js/off-canvas.js' %}"></script>
  <script src="{% static 'js/hoverable-collapse.js' %}"></script>
  <script src="{% static 'js/template.js' %}"></script>
</body>
</html>
